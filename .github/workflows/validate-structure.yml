name: Validate Repository Structure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing"
            exit 1
          fi
          echo "docs folder found"

      - name: Check ERD file exists
        run: |
          if [ ! -f "docs/erd.png" ] && [ ! -f "docs/erd.pdf" ]; then
            echo "ERROR: ERD file (erd.png or erd.pdf) missing from /docs"
            exit 1
          fi
          echo "ERD file found"

      - name: Check API endpoint plan exists
        run: |
          if [ ! -f "docs/api-endpoint-plan.md" ] && [ ! -f "docs/api-endpoint-plan.pdf" ]; then
            echo "ERROR: API endpoint plan missing from /docs"
            exit 1
          fi
          echo "API endpoint plan found"

      - name: Check SQL script exists
        run: |
          if [ ! -f "docs/raceday-schema.sql" ]; then
            echo "ERROR: SQL script missing from /docs"
            exit 1
          fi
          echo "SQL script found"

      - name: All required files present
        run: echo "Repository structure validation passed."